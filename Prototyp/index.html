<!DOCTYPE html>

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { height: 100%; width: 100%; }
  .toolbar {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: rgba(255,255,255,.95); border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.3); padding: 8px;
  }
  .toolbar button {
    display: block; width: 100%; margin: 4px 0; padding: 10px 12px; min-height: 44px;
    border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; font-size: 14px;
  }
  .toolbar button.active { background: #ffd966; border-color: #e0a800; font-weight: 600; }
  .toolbar .row { display: flex; gap: 6px; }
  .toolbar .row button { flex: 1; }
  .badge {
    display: inline-block; min-width: 20px; height: 20px; line-height: 20px; border-radius: 10px;
    background: #dc2626; color: #fff; font-weight: 700; font-size: 12px; text-align: center; padding: 0 5px; margin-left: 6px;
  }
  .panel {
    position: absolute; top: 10px; right: 10px; bottom: 10px; z-index: 1000;
    width: 320px; max-width: 90vw; background: rgba(255,255,255,.97); border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.3); padding: 12px; overflow-y: auto; display: none; font-size: 14px;
  }
  .panel h3 { margin: 0 0 10px; }
  .panel label { display: block; margin: 8px 0 2px; font-size: 13px; color: #444; }
  .panel input[type=time], .panel input[type=number], .panel input[type=text] {
    width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; min-height: 40px;
  }
  .panel .btns { display: flex; gap: 8px; margin-top: 12px; }
  .panel button.action {
    flex: 1; padding: 10px; min-height: 44px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; color: #fff;
  }
  .panel button.send { background: #15803d; }
  .panel button.cancel { background: #6b7280; }
  .panel button.primary { background: #b45309; }
  .panel button.small { font-size: 12px; padding: 6px 8px; margin: 2px 4px 0 0; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; min-height: 32px; }
  .panel .tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
  .panel .tabs button { flex: 1; min-width: 90px; padding: 8px 6px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; }
  .panel .tabs button.active { background: #ffd966; border-color: #e0a800; font-weight: 600; }
  .panel .item { border-top: 1px solid #eee; padding: 8px 0; }
  .panel .item .meta { font-size: 12px; color: #666; }
  .panel .item .dir { font-size: 12px; color: #b45309; }
  .panel .item .tag { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 8px; margin-left: 6px; }
  .panel .field { margin: 4px 0; transition: opacity .2s; }
  .panel .field .lab { display: block; margin: 8px 0 2px; font-size: 13px; color: #444; }
  .panel .field.ok .lab { color: #15803d; font-weight: 600; }
  .panel .field.ok input { border-color: #15803d; }
  .tag-aktiv { background: #fecaca; color: #991b1b; }
  .tag-entfernt { background: #e5e7eb; color: #374151; }
  .tag-nichtGefunden { background: #e5e7eb; color: #374151; }
  .tag-nichtZugaenglich { background: #d1d5db; color: #4b5563; }
  .tag-grau { background: #e5e7eb; color: #6b7280; }
  .tag-geschätzt { background: #fef3c7; color: #92400e; }
  .hint {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: rgba(0,0,0,.75); color: #fff; padding: 8px 14px; border-radius: 20px; display: none; font-size: 14px;
    max-width: 92vw; text-align: center;
  }
  .legend {
    position: absolute; bottom: 10px; left: 10px; z-index: 1000; pointer-events: none;
    background: rgba(255,255,255,.92); border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.3);
    padding: 6px 10px; font-size: 12px; line-height: 1.8;
  }
  .legend .lg { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .legend .lg-own { background: #c22; }
  .legend .lg-other { background: #2563eb; }
  .legend .lg-nest { background: #fff; border: 2px solid #ea580c; border-radius: 50%; }
  .legend .lg-line { width: 16px; height: 3px; border-radius: 2px; }
  .legend .lg-line-own { background: #b45309; }
  .legend .lg-line-other { background: #2563eb; }
  .legend .lg-line-gray { background: #9ca3af; }
  .notif { border: 1px solid #fca5a5; background: #fef2f2; border-radius: 8px; padding: 8px; margin: 6px 0; }
  .notif .big { font-size: 16px; font-weight: 700; }
  .notif a { color: #b91c1c; word-break: break-all; }
  .toast {
    position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 2000;
    background: #15803d; color: #fff; padding: 10px 18px; border-radius: 20px; display: none; font-size: 14px;
  }
  #selftest { display: none; }
  @media (max-width: 600px) {
    .toolbar { left: 6px; top: 6px; width: calc(100vw - 12px); max-width: none; }
    .toolbar .row { display: none; }
    .panel { top: 58px; left: 6px; right: 6px; bottom: 56px; width: auto; max-width: none; }
    #sightingPanel { top: auto; bottom: 0; right: 0; left: 0; width: 100%; max-width: none; max-height: 60%; z-index: 1500; }
    .legend { top: 118px; bottom: auto; left: 8px; font-size: 11px; padding: 4px 8px; z-index: 900; }
  }
  @media (max-height: 560px) and (max-width: 600px) {
    #sightingPanel { max-height: 72%; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="toolbar">
  <button id="btnModeSighting" class="active">Sichtung erfassen</button>
  <button id="btnModeAdmin">Admin-Ansicht <span id="adminBadge" class="badge" style="display:none">!</span></button>
  <div class="row">
    <button id="btnExport">Export</button>
    <button id="btnImport">Import</button>
  </div>
</div>
<input type="file" id="fileImport" accept=".json,application/json" style="display:none">

<div class="panel" id="sightingPanel">
  <h3>Sichtung erfassen</h3>
  <div id="sightingForm"></div>
</div>

<div class="panel" id="adminPanel">
  <h3>Admin-Ansicht</h3>
  <div class="tabs">
    <button data-tab="sights" class="active">Sichtungen</button>
    <button data-tab="areas">Nestbereiche</button>
    <button data-tab="notifs">Hinweise</button>
    <button data-tab="log">Protokoll</button>
  </div>
  <div id="tabSights"></div>
  <div id="tabAreas" style="display:none"></div>
  <div id="tabNotifs" style="display:none"></div>
  <div id="tabLog" style="display:none"></div>
</div>

<div class="hint" id="hint"></div>
<div class="legend">
  <div><span class="lg lg-line lg-line-own" style="vertical-align:2px"></span> Eigene Flugrichtung</div>
  <div><span class="lg lg-line lg-line-other" style="vertical-align:2px"></span> Flugrichtung anderer</div>
  <div><span class="lg lg-line lg-line-gray" style="vertical-align:2px"></span> Linie grau (Bereich nicht zugänglich)</div>
  <div><span class="lg lg-nest"></span> Wahrscheinlicher Nestbereich</div>
  <div><span class="lg lg-own"></span> Eigene Sichtung</div>
  <div><span class="lg lg-other"></span> Sichtung anderer</div>
</div>
<div class="toast" id="toast"></div>
<div id="selftest"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

const STORAGE_KEY = "hornissenfindapp";
const LINE_M = 800;
const AREA_RADIUS_M = 250;
const CLUSTER_RADIUS_M = 150;
const GRAY_ZONE_M = 350;
const HORNET_SPEED_M_PER_MIN = 333;
const MAP_LINK = (lat, lng) => `https://www.google.com/maps/search/?api=1&query=${lat.toFixed(5)},${lng.toFixed(5)}`;

// ponytail: Demodaten statt echtes Backend; Übertragung an den Admin ist lokal abgebildet.
// Die Demo-Sichtungen kreuzen sich alle in NEST_P, damit die Triangulation sofort einen Nestbereich zeigt.
const NEST_P = { lat: 49.775, lng: 9.960 };
const DEMO = [
  { id: 9001, author: "Imkerverein Maintal",    time: "09:40", lat: 49.7786, lng: 9.9600, bearing: 180, bearingMode: "map",      len: 800, note: "Am Nektarfeld" },
  { id: 9002, author: "Bienenhof Altholz",      time: "11:15", lat: 49.7750, lng: 9.9656, bearing: 270, bearingMode: "map",      len: 800, note: "" },
  { id: 9003, author: "AG Hornisse Mainfranken", time: "14:05", lat: 49.7705, lng: 9.9600, bearing: 0,   bearingMode: "map",      len: 800, note: "Rebberg" },
  { id: 9004, author: "Imkerin S. Fuchs",       time: "17:30", lat: 49.7750, lng: 9.9555, bearing: 90,  bearingMode: "map",      len: 800, note: "Obstplantage" },
  { id: 9005, author: "H. Weber",               time: "10:20", lat: 49.7708, lng: 9.9630, bearing: 210, bearingMode: "compass",   len: 800, note: "Kompass-Eingabe" },
  { id: 9006, author: "I. Schmidt",             time: "16:45", lat: 49.7810, lng: 9.9580, bearing: 195, bearingMode: "map",      len: 500, note: "Länge gemessen" }
];

let mode = "sighting";
let role = "sichtender";
let adminTab = "sights";
let draft = null;
let autoId = 1;
let areaIdSeq = 1;
let notifIdSeq = 1;

const state = load();
const map = L.map("map").setView([49.79, 9.93], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

const draftMarkerLayer = L.layerGroup().addTo(map);
const sightingsLayer = L.layerGroup().addTo(map);
const nestLayer = L.layerGroup().addTo(map);

const iconLocal = L.divIcon({ className: "", html: "<div style='width:24px;height:24px;background:#c22;border:2px solid #fff;border-radius:50%;'></div>", iconSize: [24,24], iconAnchor: [12,12] });
const iconOther = L.divIcon({ className: "", html: "<div style='width:22px;height:22px;background:#2563eb;border:2px solid #fff;border-radius:50%;'></div>", iconSize: [22,22], iconAnchor: [11,11] });

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      autoId = d.autoId || 1;
      areaIdSeq = d.areaIdSeq || 1;
      notifIdSeq = d.notifIdSeq || 1;
      (d.sightings || []).forEach(s => {
        if (s.flightMin != null && s.len == null) s.len = Math.min(LINE_M, (s.flightMin / 2) * HORNET_SPEED_M_PER_MIN);
        if (s.len == null) s.len = 800;
        delete s.flightMin;
      });
      return d;
    }
  } catch (e) { console.warn("laden fehlgeschlagen", e); }
  return seed();
}

function seed() {
  const s = {
    autoId: 1,
    areaIdSeq: 1,
    notifIdSeq: 1,
    sightings: DEMO.map(x => ({
      id: x.id, author: x.author, time: x.time, lat: x.lat, lng: x.lng,
      bearing: x.bearing, bearingMode: x.bearingMode, len: x.len != null ? x.len : 800,
      note: x.note, source: "demo", gray: false, hidden: false
    })),
    nestAreas: [],
    notifications: [],
    log: []
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  return s;
}

function save() {
  state.autoId = autoId; state.areaIdSeq = areaIdSeq; state.notifIdSeq = notifIdSeq;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function log(text) {
  state.log.unshift({ at: new Date().toISOString(), text });
  if (state.log.length > 500) state.log.length = 500;
}

function fmtTime(iso) { return iso.replace("T", " ").slice(5, 16); }

/* ---------- Daten ---------- */

function activeSightings() {
  return state.sightings.filter(s => !s.gray && !s.hidden);
}

function visibleSightings() {
  return role === "admin" ? state.sightings.filter(s => !s.hidden) : state.sightings.filter(s => s.source === "local" && !s.hidden);
}

function effLine(s) {
  return Math.min(LINE_M, (s.len != null && s.len > 0) ? s.len : LINE_M);
}

function bearingOf(s) {
  if (s.bearing != null) return s.bearing;
  return estimateBearing(s.time);
}

// ponytail: grobe Heuristik Uhrzeit→Flugrichtung (Sonne Ost→Süd→West 06–20 Uhr);
// physikalisch ungenau, nur Prototyp; echte Richtungsmodelle brauchen Daten/Biologie.
function estimateBearing(timeStr) {
  const h = parseFloat((timeStr || "12:00").replace(":", ".")) - 0.0;
  const t = h < 6 || h > 20 ? null : 90 + ((h - 6) / 14) * 180;
  return t;
}

function hasBearing(s) { return s.bearing != null; }

/* ---------- Geometrie ---------- */

function toRad(d) { return d * Math.PI / 180; }

function destPoint(start, bearingDeg, distM) {
  const R = 6371000, br = toRad(bearingDeg), d = distM / R;
  const φ1 = toRad(start.lat), λ1 = toRad(start.lng);
  const φ2 = Math.asin(Math.sin(φ1) * Math.cos(d) + Math.cos(φ1) * Math.sin(d) * Math.cos(br));
  const λ2 = λ1 + Math.atan2(Math.sin(br) * Math.sin(d) * Math.cos(φ1), Math.cos(d) - Math.sin(φ1) * Math.sin(φ2));
  return { lat: φ2 * 180 / Math.PI, lng: λ2 * 180 / Math.PI };
}

function bearing(a, b) {
  const rad = Math.PI / 180;
  const lat1 = a.lat * rad, lat2 = b.lat * rad;
  const dLon = (b.lng - a.lng) * rad;
  const y = Math.sin(dLon) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
  return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
}

let frame = { lat0: 49.79, lng0: 9.93 };
function setFrame() {
  const ss = state.sightings;
  if (ss.length) {
    frame.lat0 = ss.reduce((a, s) => a + s.lat, 0) / ss.length;
    frame.lng0 = ss.reduce((a, s) => a + s.lng, 0) / ss.length;
  }
}
function toXY(p) {
  const d = Math.PI / 180;
  return { x: (p.lng - frame.lng0) * 111320 * Math.cos(frame.lat0 * d), y: (p.lat - frame.lat0) * 111320 };
}
function seg(p1, s) {
  const a = toXY(p1);
  const e = toXY(destPoint(p1, bearingOf(s), effLine(s)));
  return { a, e, s };
}
function segIntersect(a, b) {
  const { x: x1, y: y1 } = a.a, { x: x2, y: y2 } = a.e;
  const { x: x3, y: y3 } = b.a, { x: x4, y: y4 } = b.e;
  const d1 = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
  if (Math.abs(d1) < 1e-9) return null;
  const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / d1;
  if (t < 0 || t > 1) return null;
  return { x: x1 + t * (x2 - x1), y: y1 + t * (y2 - y1) };
}
function ptSegDistSq(p, a, e) {
  const dx = e.x - a.x, dy = e.y - a.y;
  const l2 = dx * dx + dy * dy;
  if (!l2) return (p.x - a.x) ** 2 + (p.y - a.y) ** 2;
  const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2));
  return (p.x - (a.x + t * dx)) ** 2 + (p.y - (a.y + t * dy)) ** 2;
}

/* ---------- Nest-Triangulation ---------- */

function computeAreas() {
  setFrame();
  const inputs = activeSightings().filter(s => bearingOf(s) != null);
  const segs = inputs.map(s => seg({ lat: s.lat, lng: s.lng }, s));
  const pts = [];
  for (let i = 0; i < segs.length; i++) {
    for (let j = i + 1; j < segs.length; j++) {
      const p = segIntersect(segs[i], segs[j]);
      if (p) pts.push(p);
    }
  }
  const clusters = [];
  for (const p of pts) {
    let best = null, bestD = Infinity;
    for (const c of clusters) {
      const dd = Math.hypot(c.sx / c.n - p.x, c.sy / c.n - p.y);
      if (dd < bestD) { bestD = dd; best = c; }
    }
    if (best && bestD < CLUSTER_RADIUS_M) { best.sx += p.x; best.sy += p.y; best.n++; }
    else clusters.push({ n: 1, sx: p.x, sy: p.y });
  }
  const grayZones = state.nestAreas.filter(a => a.status === "nichtZugaenglich" && !a.hidden);
  const newAreas = [];
  clusters.forEach(c => {
    const cx = c.sx / c.n, cy = c.sy / c.n;
    const ids = inputs.filter(s => {
      const g = seg({ lat: s.lat, lng: s.lng }, s);
      return ptSegDistSq({ x: cx, y: cy }, g.a, g.e) <= AREA_RADIUS_M ** 2;
    }).map(s => s.id);
    if (ids.length < 3) return;
    const latlng = xyToLatLng(cx, cy);
    const blocked = grayZones.some(z => Math.hypot(toXY({ lat: z.lat, lng: z.lng }).x - cx, toXY({ lat: z.lat, lng: z.lng }).y - cy) < GRAY_ZONE_M);
    if (blocked) return;
    newAreas.push({ lat: latlng.lat, lng: latlng.lng, ids });
  });
  return newAreas;
}

function xyToLatLng(x, y) {
  const d = Math.PI / 180;
  return { lat: frame.lat0 + y / 111320, lng: frame.lng0 + x / (111320 * Math.cos(frame.lat0 * d)) };
}

function mergeAreas(computed) {
  computed.forEach(ca => {
    const existing = state.nestAreas.filter(a => a.status === "aktiv").find(a =>
      Math.hypot(toXY({ lat: a.lat, lng: a.lng }).x - toXY({ lat: ca.lat, lng: ca.lng }).x,
                 toXY({ lat: a.lat, lng: a.lng }).y - toXY({ lat: ca.lat, lng: ca.lng }).y) < CLUSTER_RADIUS_M);
    if (existing) {
      existing.lat = ca.lat; existing.lng = ca.lng; existing.ids = ca.ids; existing.count = ca.ids.length;
    } else {
      state.nestAreas.push({ id: areaIdSeq++, lat: ca.lat, lng: ca.lng, radius: AREA_RADIUS_M, ids: ca.ids, count: ca.ids.length, status: "aktiv", link: MAP_LINK(ca.lat, ca.lng), createdAt: new Date().toISOString() });
    }
  });
  state.nestAreas.forEach(a => {
    if (a.status === "aktiv") {
      const still = computed.some(ca => Math.hypot(toXY({ lat: a.lat, lng: a.lng }).x - toXY({ lat: ca.lat, lng: ca.lng }).x, toXY({ lat: a.lat, lng: a.lng }).y - toXY({ lat: ca.lat, lng: ca.lng }).y) < CLUSTER_RADIUS_M);
      if (!still) a.status = "erledigt", a.hidden = true;
    }
  });
  // Benachrichtigung für neu entstandene aktive Bereiche
  state.nestAreas.filter(a => a.status === "aktiv").forEach(a => {
    if (!state.notifications.some(n => n.areaId === a.id)) {
      state.notifications.push({ id: notifIdSeq++, areaId: a.id, link: a.link, at: new Date().toISOString(), read: false });
      log(`Neuer wahrscheinlicher Nestbereich #${a.id} bei ${a.lat.toFixed(4)}, ${a.lng.toFixed(4)} (${a.count} Linien).`);
    }
  });
  save();
}

/* ---------- Admin-Status ---------- */

function setAreaStatus(areaId, status) {
  const a = state.nestAreas.find(x => x.id === areaId);
  if (!a || a.status === status) return;
  const wasGray = a.status === "nichtZugaenglich";
  const old = a.status;
  a.status = status;
  if (status === "nichtZugaenglich") {
    a.ids.forEach(id => { const s = state.sightings.find(x => x.id === id); if (s) s.gray = true; });
    log(`Bereich #${a.id}: „Bereich nicht zugänglich" – ${a.ids.length} Linien grau hinterlegt.`);
  } else if (status === "entfernt") {
    a.ids.forEach(id => { const s = state.sightings.find(x => x.id === id); if (s) { s.gray = false; s.hidden = true; } });
    a.hidden = true;
    log(`Bereich #${a.id}: „Nest entfernt" – ${a.ids.length} zugehörige Linien entfernt.`);
  } else if (status === "nichtGefunden") {
    a.hidden = true;
    log(`Bereich #${a.id}: „Nest nicht gefunden" – Suchbereich gelöscht, Linien bleiben.`);
  } else if (status === "aktiv") {
    a.hidden = false;
    log(`Bereich #${a.id} reaktiviert (zuvor: ${old}).`);
  }
  save();
  refresh();
}

/* ---------- Karten-Rendering ---------- */

function clearLayer(l) { l.clearLayers(); }

function lineStyle(s) {
  const gray = s.gray;
  const own = s.source === "local";
  const color = gray ? "#9ca3af" : (own ? "#b45309" : "#2563eb");
  return { color, weight: gray ? 2 : 3, opacity: gray ? 0.6 : 1 };
}

function linePopup(s) {
  const b = bearingOf(s);
  const dirTxt = b == null ? "keine Richtung (Uhrzeit-Schätzung nicht möglich)" : (hasBearing(s) ? (s.bearingMode === "compass" ? `Kompass ${Math.round(b)}°` : `~${Math.round(b)}°`) : `geschätzt (${s.time})`);
  const lenTxt = s.len != null ? `${s.len} m` : "800 m";
  return `<b>${escapeHtml(s.author)}</b> · ${s.time}<br>` +
    `<span class="meta">${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}</span><br>` +
    `<span class="dir">Flugrichtung: ${dirTxt}</span><br>` +
    `<span class="meta">Strichlänge: ${lenTxt}</span><br>` +
    `<label style="font-size:12px;color:#444">Länge in Metern (max. 800):</label>` +
    `<input type="number" min="1" max="800" step="10" id="len${s.id}" value="${s.len != null ? s.len : 800}" style="width:80px;padding:4px;margin:2px 4px 0 0">` +
    `<button class="small" onclick="saveLineLen(${s.id})">Speichern</button>` +
    `<button class="small" onclick="delSighting(${s.id})">Löschen</button>`;
}

window.saveLineLen = function (id) {
  const s = state.sightings.find(x => x.id === id);
  if (!s) return;
  const v = document.getElementById("len" + id);
  const t = parseInt(v.value, 10);
  s.len = t > 0 ? Math.min(LINE_M, t) : 800;
  save();
  log(`Strichlänge für Sichtung ${id} aktualisiert (${s.len} m).`);
  refresh();
};
window.delSighting = function (id) {
  if (!confirm("Sichtung löschen?")) return;
  const s = state.sightings.find(x => x.id === id);
  if (s) { s.hidden = true; log(`Sichtung ${id} gelöscht.`); }
  save();
  refresh();
};

function lineColor(s) {
  return s.gray ? "#9ca3af" : (s.source === "local" ? "#b45309" : "#2563eb");
}

function arrowAt(end, bearingDeg, color, interactive) {
  const head = L.divIcon({
    className: "", iconSize: [22, 22], iconAnchor: [11, 11],
    html: `<div style="width:22px;height:22px;display:flex;align-items:center;justify-content:center;pointer-events:none"><svg width="18" height="18" viewBox="-9 -9 18 18" style="overflow:visible;transform:rotate(${bearingDeg}deg)"><polygon points="0,-8 6,5 -6,5" fill="${color}" stroke="#fff" stroke-width="1.5"/></svg></div>`
  });
  return L.marker([end.lat, end.lng], { icon: head, interactive: !!interactive });
}

function renderMap() {
  clearLayer(sightingsLayer);
  clearLayer(nestLayer);
  const vis = visibleSightings();
  vis.forEach(s => {
    const p = { lat: s.lat, lng: s.lng };
    const b = bearingOf(s);
    if (b == null) return;
    const end = destPoint(p, b, effLine(s));
    const line = L.polyline([p, end], lineStyle(s)).addTo(sightingsLayer);
    line.bindPopup(linePopup(s));
    arrowAt(end, b, lineColor(s)).addTo(sightingsLayer);
    const m = L.marker([s.lat, s.lng], { icon: s.source === "local" ? iconLocal : iconOther }).addTo(sightingsLayer);
    m.bindPopup(linePopup(s));
  });
  const areas = state.nestAreas.filter(a => !a.hidden);
  areas.forEach(a => {
    const gray = a.status === "nichtZugaenglich";
    const col = gray ? "#6b7280" : "#ea580c";
    L.circle([a.lat, a.lng], { radius: a.radius, color: col, fillColor: gray ? "#9ca3af" : "#fdba74", fillOpacity: gray ? 0.35 : 0.2, weight: 2 }).addTo(nestLayer);
    if (!gray) {
      L.marker([a.lat, a.lng], { icon: L.divIcon({ className: "", html: "<div style='width:26px;height:26px;background:#fff;border:3px solid #ea580c;border-radius:50%;text-align:center;line-height:22px;font-weight:800;color:#ea580c;font-size:14px'><b>!</b></div>", iconSize: [26, 26], iconAnchor: [13, 13] }) })
        .addTo(nestLayer)
        .bindPopup(`<b>Wahrscheinlicher Nestbereich #${a.id}</b><br><span class="meta">${a.lat.toFixed(5)}, ${a.lng.toFixed(5)}</span><br><span class="dir">aus ${a.count} Linien</span><br><a href="${a.link}" target="_blank" rel="noopener">Google-Maps-Link</a>`);
    }
  });
}

let draftLine = null;
let draftArrow = null;
let dragMarker = null;

function renderDraft() {
  clearLayer(draftMarkerLayer);
  draftLine = null;
  draftArrow = null;
  dragMarker = null;
  if (!draft) return;
  if (draft.lat != null) {
    const p = { lat: draft.lat, lng: draft.lng };
    if (draft.bearing != null) {
      const end = destPoint(p, draft.bearing, draftFlightLen());
      draftLine = L.polyline([p, end], { color: "#b45309", weight: 3 }).addTo(draftMarkerLayer);
      draftArrow = arrowAt(end, draft.bearing, "#b45309", true).addTo(draftMarkerLayer);
      draftArrow.on("mousedown touchstart", (e) => { if (draft) { L.DomEvent.stopPropagation(e); enableLineDrag(); } });
    }
    dragMarker = L.marker([draft.lat, draft.lng], { icon: iconLocal, draggable: true }).addTo(draftMarkerLayer);
    dragMarker.on("drag", (e) => {
      if (!draft) return;
      draft.lat = e.latlng.lat; draft.lng = e.latlng.lng;
      const pos = { lat: draft.lat, lng: draft.lng };
      if (draft.bearing != null && draftLine && draftArrow) {
        const end = destPoint(pos, draft.bearing, draftFlightLen());
        draftLine.setLatLngs([[pos.lat, pos.lng], [end.lat, end.lng]]);
        draftArrow.setLatLng([end.lat, end.lng]);
      }
      refreshDraftFields();
    });
    dragMarker.on("dragend", () => { if (draft) { renderDraft(); refreshDraftFields(); } });
  }
}
function draftFlightLen() {
  return Math.min(LINE_M, (draft.len != null && draft.len > 0) ? draft.len : LINE_M);
}

/* ---------- Sichtungs-UI ---------- */

function refreshDraftFields() {
  const f = document.getElementById("sightingForm");
  if (!f) return;
  const flLoc = document.getElementById("fieldLoc");
  const flTime = document.getElementById("fieldTime");
  const flDir = document.getElementById("fieldDir");
  if (flLoc) flLoc.classList.toggle("ok", draft.lat != null);
  if (flTime) flTime.classList.toggle("ok", !!draft.time);
  if (flDir) flDir.classList.toggle("ok", draft.bearing != null);
  const btn = document.getElementById("btnSend");
  if (btn) {
    const ready = draft.lat != null && draft.time && draft.bearing != null;
    btn.classList.toggle("send", ready);
    btn.classList.toggle("cancel", !ready);
    btn.style.background = ready ? "#15803d" : "#9ca3af";
  }
}

/* ---------- Karten-Interaktion (Long-Press) ---------- */

let longPressTimer = null;
let longPressFiredAt = 0;
let draggingLine = false;

function enableLineDrag() {
  if (draggingLine || !draft || draft.lat == null || draft.bearing == null) return;
  draggingLine = true;
  map.dragging.disable();
  map.getContainer().classList.add("dragline");
  const update = () => {
    const ll = map.mouseEventToLatLng(dragLatestPos);
    if (!ll) return;
    const base = { lat: draft.lat, lng: draft.lng };
    draft.bearing = bearing(base, ll);
    draft.len = Math.max(50, Math.min(LINE_M, dist(base, ll)));
    draft.bearingMode = "map";
    const end = destPoint(base, draft.bearing, draftFlightLen());
    if (draftLine) draftLine.setLatLngs([[base.lat, base.lng], [end.lat, end.lng]]);
    if (draftArrow) draftArrow.setLatLng([end.lat, end.lng]);
    refreshDraftFields();
  };
  const move = (e) => {
    if (!draft) return;
    const oe = e.originalEvent || e;
    dragLatestPos = oe.touches ? oe.touches[0] : oe;
    update();
  };
  const done = () => {
    map.dragging.enable();
    map.getContainer().classList.remove("dragline");
    map.off("mousemove", move);
    map.off("touchmove", move);
    map.off("mouseup", done);
    map.off("touchend", done);
    draggingLine = false;
    if (draft) { renderDraft(); refreshDraftFields(); }
  };
  map.on("mousemove", move);
  map.on("touchmove", move);
  map.on("mouseup", done);
  map.on("touchend", done);
}

function cancelLineDrag() {
  if (!draggingLine) return;
  draggingLine = false;
  map.dragging.enable();
  map.getContainer().classList.remove("dragline");
  map.off("mousemove");
  map.off("touchmove");
  map.off("mouseup");
  map.off("touchend");
}

let dragLatestPos = null;

function dist(a, b) {
  const R = 6371000, d = Math.PI / 180;
  const dLat = (b.lat - a.lat) * d, dLon = (b.lng - a.lng) * d;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * d) * Math.cos(b.lat * d) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

map.on("click", (e) => {
  if (!draft || draggingLine) return;
  if (Date.now() - longPressFiredAt < 800) return;
  if (draft.lat == null) {
    draft.lat = e.latlng.lat;
    draft.lng = e.latlng.lng;
    renderDraft();
    refreshDraftFields();
  } else if (draft.bearing == null) {
    draft.bearing = bearing({ lat: draft.lat, lng: draft.lng }, e.latlng);
    draft.bearingMode = "map";
    draft.len = 800;
    renderDraft();
    refreshDraftFields();
  }
});

/* Long-Press zum Setzen des Sichtungsortes */
function fireLongPress(lat, lng) {
  draft.lat = lat;
  draft.lng = lng;
  longPressFiredAt = Date.now();
  renderDraft();
  refreshDraftFields();
}
map.on("mousedown", (e) => {
  if (!draft || draft.lat != null || draggingLine) return;
  longPressTimer = setTimeout(() => fireLongPress(e.latlng.lat, e.latlng.lng), 450);
});
map.on("touchstart", (e) => {
  if (!draft || draft.lat != null || draggingLine) return;
  const t = e.touches[0];
  const rect = map.getContainer().getBoundingClientRect();
  longPressTimer = setTimeout(() => {
    const ll = map.containerPointToLatLng(L.point(t.clientX - rect.left, t.clientY - rect.top));
    fireLongPress(ll.lat, ll.lng);
  }, 450);
});
map.on("mouseup", () => clearLongPress());
map.on("touchend", () => clearLongPress());
function clearLongPress() { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } }

function send() {
  updateDraftFromForm();
  if (draft.lat == null) return;
  if (!draft.time) return;
  if (draft.bearing == null) {
    const est = estimateBearing(draft.time);
    if (est != null) { draft.bearing = est; draft.bearingMode = "estimated"; }
  }
  if (draft.bearing == null) return;
  const s = {
    id: autoId++, author: "Eigene Sichtung", time: draft.time,
    lat: draft.lat, lng: draft.lng,
    bearing: draft.bearing, bearingMode: draft.bearingMode,
    len: draft.len != null ? Math.min(LINE_M, draft.len) : 800, note: draft.note.trim(),
    source: "local", gray: false, hidden: false
  };
  state.sightings.push(s);
  save();
  log(`Sichtung ${s.id} gesendet (${s.time}, ${s.lat.toFixed(5)}, ${s.lng.toFixed(5)})${s.bearing != null ? ", Flugrichtung ~" + Math.round(s.bearing) + "°" : ""}.`);
  draft = null;
  cancelLineDrag();
  renderDraft();
  document.getElementById("sightingPanel").style.display = "none";
  showHint("");
  toast("Sichtung gesendet. Der Admin sieht alle Sichtungen.");
  refresh();
}

/* ---------- Export / Import ---------- */

function exportData() {
  const blob = new Blob([JSON.stringify({ version: 2, exportedAt: new Date().toISOString(), data: state }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `hornissenfind-daten-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      const src = d.data || d;
      if (!Array.isArray(src.sightings)) throw new Error("Datei enthält keine Sichtungen.");
      if (!confirm("Der Import ersetzt alle lokalen Daten. Fortfahren?")) return;
      state.sightings = src.sightings.map(x => Object.assign({ source: "local", gray: false, hidden: false }, x));
      state.nestAreas = src.nestAreas || [];
      state.notifications = src.notifications || [];
      state.log = src.log || [];
      autoId = Math.max.apply(null, [0].concat(state.sightings.map(s => s.id))) + 1;
      areaIdSeq = Math.max.apply(null, [0].concat(state.nestAreas.map(a => a.id))) + 1;
      notifIdSeq = Math.max.apply(null, [0].concat(state.notifications.map(n => n.id))) + 1;
      save();
      refresh();
      toast("Daten importiert.");
    } catch (err) {
      alert("Import fehlgeschlagen: " + err.message);
    }
    e.target.value = "";
  };
  reader.readAsText(file);
}

function toast(msg) {

function escapeHtml(t) {

}

/* ---------- Selbsttest Geometrie ---------- */

function selfTest() {
  const okList = [];
  const d1 = destPoint({ lat: 0, lng: 0 }, 90, 111320);
  okList.push(Math.abs(d1.lng - 1) < 0.01 && Math.abs(d1.lat) < 0.01 ? "destPoint" : "destPoint FAIL");
  frame = { lat0: 49.79, lng0: 9.93 };
  const isect = segIntersect({ a: toXY({ lat: 49.775, lng: 9.960 }), e: toXY({ lat: 49.775, lng: 9.970 }), s: {} }, { a: toXY({ lat: 49.77, lng: 9.965 }), e: toXY({ lat: 49.78, lng: 9.965 }), s: {} });
  okList.push(isect && Math.abs(isect.y - toXY({ lat: 49.775, lng: 9.965 }).y) < 1 && Math.abs(isect.x - toXY({ lat: 49.775, lng: 9.965 }).x) < 1 ? "segIntersect" : "segIntersect FAIL");
  okList.push(effLenTest() ? "effLen" : "effLen FAIL");
  okList.push((e => e === 90 + (12 - 6) / 14 * 180)(estimateBearing("12:00")) ? "estimateBearing" : "estimateBearing FAIL");
  const ok = okList.every(x => !x.endsWith("FAIL"));
  document.getElementById("selftest").textContent = ok ? "selftest:OK" : "selftest:FAIL " + okList.join(",");
  if (!ok) console.error("Selbsttest fehlgeschlagen:", okList);
  return ok;
}

function effLenTest() {
  const a = { len: 500 };
  const b = { len: 1100 };
  const la = Math.min(LINE_M, 500);
  const lb = Math.min(LINE_M, 1100);
  return la === effLine(a) && lb === effLine(b);
}

    role = "admin";
    document.getElementById("btnModeAdmin").classList.add("active");
    document.getElementById("btnModeSighting").classList.remove("active");
    document.getElementById("sightingPanel").style.display = "none";
    renderMap();
    renderAdminPanels();
    showHint("Admin-Ansicht: alle Sichtungen und Flugrichtungen. Kreuzungsbereiche (≥3 Striche) = Nestverdacht mit Google-Maps-Link.");
  };
  document.querySelectorAll(".tabs button").forEach(b => {
    b.onclick = () => {
      adminTab = b.dataset.tab;
      document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("active", x === b));
      ["sights", "areas", "notifs", "log"].forEach(t => document.getElementById("tab" + t.charAt(0).toUpperCase() + t.slice(1)).style.display = t === adminTab ? "block" : "none");
    };
  });
  document.getElementById("btnExport").onclick = exportData;
  document.getElementById("btnImport").onclick = () => document.getElementById("fileImport").click();
  document.getElementById("fileImport").onchange = handleImport;
  startSighting();
  refresh();
  selfTest();
  if (new URLSearchParams(location.search).has("adm")) {
    role = "admin";
    document.getElementById("btnModeAdmin").click();
  }
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("./sw.js").catch(err => console.warn("SW-Registrierung fehlgeschlagen", err));
  }
}

init();
</script>
</body>
</html>
