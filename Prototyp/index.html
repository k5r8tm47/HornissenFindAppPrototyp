<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HornissenFindApp – Prototyp</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { height: 100%; width: 100%; }
  .toolbar {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: rgba(255,255,255,.95); border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.3); padding: 8px;
  }
  .toolbar button {
    display: block; width: 100%; margin: 4px 0; padding: 8px 12px;
    border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; font-size: 14px;
  }
  .toolbar button.active { background: #ffd966; border-color: #e0a800; font-weight: 600; }
  .panel {
    position: absolute; top: 10px; right: 10px; bottom: 10px; z-index: 1000;
    width: 300px; max-width: 90vw; background: rgba(255,255,255,.97); border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.3); padding: 10px; overflow-y: auto; display: none;
  }
  .panel h3 { margin: 0 0 8px; }
  .panel .fang { border-top: 1px solid #eee; padding: 6px 0; }
  .panel .fang .meta { font-size: 12px; color: #666; }
  .panel .fang .meta.direction { color: #b45309; }
  .panel button.small { font-size: 12px; padding: 2px 8px; margin: 2px 4px 0 0; }
  .hint {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: rgba(0,0,0,.7); color: #fff; padding: 8px 14px; border-radius: 20px; display: none; font-size: 14px;
  }
  .arrow-icon { width: 36px; height: 36px; text-align: center; line-height: 36px; font-size: 30px; font-weight: bold; color: #b45309; }
</style>
</head>
<body>
<div id="map"></div>

<div class="toolbar">
  <button id="btnFang">Fangort setzen</button>
  <button id="btnList">Fänge anzeigen</button>
</div>

<div class="panel" id="panel">
  <h3>Fänge</h3>
  <div id="fangList"></div>
</div>

<div class="hint" id="hint"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

const STORAGE_KEY = "hornissenfindapp";
let mode = null;
let pendingFangId = null;
let autoId = 1;
const fangLayers = new Map();

const state = load();
const map = L.map("map").setView([50.0, 10.0], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

const fangIcon = L.divIcon({ className: "", html: "<div style='width:26px;height:26px;background:#c22;border:2px solid #fff;border-radius:50%;'></div>", iconSize: [26,26], iconAnchor: [13,13] });

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      autoId = (d.autoId || 1);
      return d;
    }
  } catch (e) { console.warn("laden fehlgeschlagen", e); }
  return { fangs: [] };
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function setMode(m, activeButton) {
  mode = m;
  document.getElementById("btnFang").classList.remove("active");
  if (activeButton) activeButton.classList.add("active");
  if (m === "fang") showHint("1. Klicke auf die Karte an den Ort, an dem du die Hornisse gefangen hast.");
  else if (m === "richtung") showHint("2. Klicke in die Richtung, in die die freigelassene Hornisse geflogen ist.");
  else showHint("");
}

function showHint(text) {
  const h = document.getElementById("hint");
  h.textContent = text;
  h.style.display = text ? "block" : "none";
}

function addFang(latlng) {
  const note = prompt("Notiz zum Fang (optional):", new Date().toISOString().slice(0, 10));
  if (note === null) { setMode(mode, btnFang); return; }
  const fang = { id: autoId++, lat: latlng.lat, lng: latlng.lng, note: note.trim(), direction: null };
  state.fangs.push(fang);
  createFangLayers(fang);
  save();
  pendingFangId = fang.id;
  setMode("richtung");
}

function createFangLayers(fang) {
  const marker = L.marker([fang.lat, fang.lng], { icon: fangIcon }).addTo(map);
  marker.bindPopup(buildPopup(fang));
  const layers = { marker, line: null, arrow: null };
  fangLayers.set(fang.id, layers);
  drawDirection(fang);
}

function buildPopup(fang) {
  const richtungBtn = fang.direction
    ? `<button class="small" onclick="setDirectionMode(${fang.id})">Flugrichtung ändern</button>`
    : `<button class="small" onclick="setDirectionMode(${fang.id})">Flugrichtung festlegen</button>`;
  return `<b>${escapeHtml(fang.note || "")}</b><br>
    <span class="meta">${fang.lat.toFixed(5)}, ${fang.lng.toFixed(5)}</span><br>
    ${richtungBtn}
    <button class="small" onclick="deleteFang(${fang.id})">Löschen</button>`;
}

function drawDirection(fang) {
  const layers = fangLayers.get(fang.id);
  if (!fang.direction) return;
  if (layers.line) map.removeLayer(layers.line);
  if (layers.arrow) map.removeLayer(layers.arrow);
  const start = L.latLng(fang.lat, fang.lng);
  const end = L.latLng(fang.direction.lat, fang.direction.lng);
  layers.line = L.polyline([start, end], { color: "#b45309", weight: 3, dashArray: "6 4" }).addTo(map);
  layers.arrow = L.marker(end, {
    icon: L.divIcon({
      className: "",
      html: `<div class="arrow-icon" style="transform:rotate(${bearing(start, end)}deg);">▲</div>`,
      iconSize: [36, 36],
      iconAnchor: [18, 31]
    })
  }).addTo(map);
}

function bearing(a, b) {
  const rad = Math.PI / 180;
  const lat1 = a.lat * rad, lat2 = b.lat * rad;
  const dLon = (b.lng - a.lng) * rad;
  const y = Math.sin(dLon) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
  return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
}

function setDirectionMode(id) {
  pendingFangId = id;
  setMode("richtung");
}

map.on("click", (e) => {
  if (mode === "fang") { addFang(e.latlng); }
  else if (mode === "richtung" && pendingFangId != null) {
    const fang = state.fangs.find(f => f.id === pendingFangId);
    if (!fang) return;
    fang.direction = { lat: e.latlng.lat, lng: e.latlng.lng };
    drawDirection(fang);
    fangLayers.get(fang.id).marker.bindPopup(buildPopup(fang));
    save();
    pendingFangId = null;
    setMode("fang", document.getElementById("btnFang"));
  }
});

document.getElementById("btnFang").addEventListener("click", () => {
  document.getElementById("panel").style.display = "none";
  setMode(mode === "fang" ? null : "fang", btnFang);
});
document.getElementById("btnList").addEventListener("click", () => {
  if (mode === "fang") setMode(null);
  const panel = document.getElementById("panel");
  panel.style.display = panel.style.display === "block" ? "none" : "block";
  renderList();
});

function renderList() {
  const list = document.getElementById("fangList");
  list.innerHTML = "";
  if (!state.fangs.length) {
    list.innerHTML = '<div style="color:#888">Noch keine Fänge. Starte mit "Fangort setzen".</div>';
    return;
  }
  state.fangs
    .slice()
    .sort((a, b) => (a.note || "").localeCompare(b.note || ""))
    .forEach(f => {
      const div = document.createElement("div");
      div.className = "fang";
      const dirTxt = f.direction
        ? `Flugrichtung: ${f.direction.lat.toFixed(5)}, ${f.direction.lng.toFixed(5)}`
        : "Flugrichtung: noch nicht eingegeben";
      div.innerHTML =
        `<div>${escapeHtml(f.note || "Fang")}</div>` +
        `<div class="meta">${f.lat.toFixed(5)}, ${f.lng.toFixed(5)}</div>` +
        `<div class="meta direction">${dirTxt}</div>` +
        `<button class="small" onclick="setDirectionMode(${f.id})">${f.direction ? "Flugrichtung ändern" : "Flugrichtung festlegen"}</button>` +
        `<button class="small" onclick="deleteFang(${f.id})">Löschen</button>`;
      list.appendChild(div);
    });
}

function escapeHtml(t) {
  const d = document.createElement("div");
  d.textContent = t;
  return d.innerHTML;
}

function deleteFang(id) {
  if (!confirm("Fang löschen?")) return;
  state.fangs = state.fangs.filter(f => f.id !== id);
  const layers = fangLayers.get(id);
  map.removeLayer(layers.marker);
  if (layers.line) map.removeLayer(layers.line);
  if (layers.arrow) map.removeLayer(layers.arrow);
  fangLayers.delete(id);
  save();
  renderList();
}

state.fangs.forEach(f => {
  createFangLayers(f);
  if (f.direction) drawDirection(f);
});
</script>
</body>
</html>
